<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripBoard - Email Verification (login.html Styling)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary-dark": "#071D3A",
                        "primary-blue": "#172B4D",
                        "brand-blue": "#2E5BFF",
                        "bg-ice": "#EAF5FC",
                        "accent-gold": "#D4AF37",
                        "gold-btn": "#C9A227",
                        "gold-btn-hover": "#A98717",
                        "gold-light": "#F4D675",
                        "footer-text": "#B8C9DA",
                    }
                }
            }
        }
    </script>
    <style>
        .flow-container {
            width: 100%;
            max-width: 600px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(11, 42, 85, 0.15);
        }
        .otp-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #D5E5F2;
            border-radius: 10px;
            background-color: #F8FCFF;
            color: #0B2A55;
            outline: none;
            transition: 0.2s;
        }
        .otp-input:focus {
            border-color: #1659A5;
            box-shadow: 0 0 0 3px rgba(93, 184, 232, 0.2);
            background-color: white;
        }
        .gold-button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(135deg, #C9A227, #E0B82F);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(201, 162, 39, 0.30);
            transition: 0.3s;
            text-transform: uppercase;
        }
        .gold-button:hover {
            background: #A98717;
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(201, 162, 39, 0.40);
        }
    </style>
</head>
<body class="bg-bg-ice text-primary-blue font-sans m-0 min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="min-h-[110px] md:h-[125px] relative flex flex-col md:flex-row items-center justify-between px-6 md:px-10 py-3 md:py-0 gap-3 md:gap-0 bg-cover bg-right md:bg-center bg-no-repeat shadow-nav border-b border-slate-200" style="background-image: url('../Assets/bg2.png'); background-color: #0c3370;">
        <a href="../index.html" class="relative z-10 flex items-center gap-3.5 group no-underline">
            <img src="../Assets/logo_svg.svg" alt="TripBoard Logo" class="h-12 md:h-14 w-auto drop-shadow-[0_2px_8px_rgba(0,0,0,0.35)] transition-transform duration-300 group-hover:scale-105">
            <div class="flex flex-col">
                <span class="text-white font-black text-2xl md:text-[27px] tracking-[2px] leading-none drop-shadow-md">TRIPBOARD</span>
                <span class="text-sky-200/90 text-[10px] md:text-[11px] font-medium tracking-wider mt-1 leading-none drop-shadow-sm">Corporate Travel Management. Simplified.</span>
            </div>
        </a>

        <nav class="relative z-10 flex items-center gap-6 md:gap-8">
            <a href="../index.html" class="text-white text-sm md:text-[15px] font-semibold drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)] transition-all duration-200 hover:text-gold-light hover:-translate-y-0.5">Home</a>
            <a href="login-preview.html" class="text-white text-sm md:text-[15px] font-semibold drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)] transition-all duration-200 hover:text-gold-light hover:-translate-y-0.5">Login</a>
        </nav>
    </header>

    <!-- MAIN SECTION: EMAIL VERIFICATION -->
    <main class="flex-1 flex items-center justify-center p-4 md:p-8 my-6">
        <div class="flow-container p-8 md:p-12 text-center">
            
            <div class="w-16 h-16 mx-auto mb-4 bg-sky-50 border border-sky-200 rounded-2xl flex items-center justify-center text-2xl">
                ✉️
            </div>

            <h2 class="text-2xl md:text-3xl font-extrabold text-[#0B2A55] mb-2 tracking-wide">VERIFY YOUR EMAIL</h2>
            <p class="text-sm text-slate-500 mb-8">
                Enter the 6-digit confirmation code sent to <br>
                <span class="font-bold text-[#0B2A55]">employee@company.com</span>
            </p>

            <form class="space-y-6" onsubmit="event.preventDefault();">
                <!-- 6-digit OTP inputs -->
                <div class="flex gap-2.5 justify-center">
                    <input type="text" maxlength="1" value="5" class="otp-input">
                    <input type="text" maxlength="1" value="2" class="otp-input">
                    <input type="text" maxlength="1" value="9" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                    <input type="text" maxlength="1" class="otp-input">
                </div>

                <button type="submit" class="gold-button">
                    VERIFY & CONTINUE
                </button>
            </form>

            <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4 text-xs font-semibold text-slate-500">
                <span>Didn't receive the code?</span>
                <button type="button" class="text-[#1659A5] hover:text-gold-btn transition">
                    Resend Email (60s)
                </button>
            </div>

            <div class="mt-8">
                <a href="login-preview.html" class="text-sm font-bold text-[#1659A5] hover:text-gold-btn transition-colors">
                    ← Back to Login
                </a>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-primary-dark text-footer-text text-center py-5 px-4 text-sm mt-auto">
        <p class="m-0">© 2026 TripBoard. All Rights Reserved.</p>
    </footer>

</body>
</html>
