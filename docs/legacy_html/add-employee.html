<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripBoard - Add Employee</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary-dark": "#071D3A",
                        "primary-blue": "#172B4D",
                        "brand-blue": "#2E5BFF",
                        "bg-ice": "#EAF5FC",
                        "accent-gold": "#D4AF37",
                        "accent-gold-hover": "#A98717",
                        "gold-btn": "#C9A227",
                        "gold-btn-hover": "#A98717",
                        "gold-light": "#F4D675",
                        "status-green": "#2ECC71",
                        "status-orange": "#F39C12",
                        "footer-text": "#B8C9DA",
                    },
                    borderRadius: {
                        "xl": "12px",
                        "2xl": "16px",
                    },
                    boxShadow: {
                        "card": "0 4px 20px rgba(0,0,0,0.08)",
                        "nav": "0 4px 20px rgba(7,29,58,0.25)",
                        "btn-gold": "0 4px 10px rgba(201,162,39,0.35)",
                        "btn-gold-hover": "0 6px 15px rgba(201,162,39,0.50)",
                    },
                    fontFamily: {
                        sans: ["Arial", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">

</head>

<body class="add-employee-page min-h-screen flex flex-col justify-between">


<!-- HEADER -->

<header class="!min-h-[110px] md:!h-[125px] !h-auto relative !flex flex-col md:flex-row !items-center !justify-between px-6 md:px-10 py-3 md:py-0 gap-3 md:gap-0 bg-cover bg-right md:bg-center bg-no-repeat shadow-nav border-b border-slate-200 before:!hidden" style="background-image: url('Assets/bg2.png'); background-color: #0c3370;">

    <!-- Left: Brand Lockup with logo_svg.svg -->
    <a href="admin.html" class="relative z-10 flex items-center gap-3.5 group text-decoration-none">
        <img src="Assets/logo_svg.svg" alt="TripBoard Logo" class="h-12 md:h-14 w-auto drop-shadow-[0_2px_8px_rgba(0,0,0,0.35)] transition-transform duration-300 group-hover:scale-105">
        <div class="flex flex-col">
            <span class="text-white font-black text-2xl md:text-[27px] tracking-[2px] leading-none drop-shadow-md">TRIPBOARD</span>
            <span class="text-sky-200/90 text-[10px] md:text-[11px] font-medium tracking-wider mt-1 leading-none drop-shadow-sm">Corporate Travel Management. Simplified.</span>
        </div>
    </a>

    <!-- Right: Navigation Links + Gold Logout Button -->
    <nav class="relative z-10 !flex items-center gap-6 md:gap-8">
        <a href="admin.html" class="text-white font-semibold text-sm md:text-[15px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)] transition-all duration-200 hover:text-gold-light hover:-translate-y-0.5">Dashboard</a>
        <a href="employees.html" class="text-gold-light font-semibold text-sm md:text-[15px] border-b-2 border-accent-gold pb-0.5 drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)]">Employees</a>
        <a href="trips.html" class="text-white font-semibold text-sm md:text-[15px] drop-shadow-[0_1px_2px_rgba(0,0,0,0.6)] transition-all duration-200 hover:text-gold-light hover:-translate-y-0.5">Trips</a>
        <a href="index.html" class="bg-gold-btn hover:bg-gold-btn-hover text-white text-sm font-semibold py-2 px-5 rounded-md shadow-btn-gold hover:shadow-btn-gold-hover hover:-translate-y-0.5 transition-all duration-200 !text-white text-decoration-none">
            Logout
        </a>
    </nav>

</header>



<!-- MAIN -->

<main class="add-employee-container">


    <!-- PAGE HEADING -->

    <div class="add-heading">

        <div>

            <h1>ADD EMPLOYEE</h1>

            <p>
                Add a new employee to your company.
            </p>

        </div>

        <a href="employees.html" class="back-btn">
            ← Back to Employees
        </a>

    </div>



    <!-- FORM CARD -->

    <section class="employee-form-card">


        <div class="form-header">

            <div class="form-icon">
                👤
            </div>

            <div>

                <h2>Employee Information</h2>

                <p>
                    Enter the employee's details below.
                </p>

            </div>

        </div>



        <form>


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter employee name"
                    required
                >

            </div>



            <!-- EMPLOYEE ID -->

            <div class="form-group">

                <label for="employee-id">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="employee-id"
                    placeholder="Example: EMP005"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="employee@company.com"
                    required
                >

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>



            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <select id="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="HR">
                        Human Resources
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Sales">
                        Sales
                    </option>

                    <option value="Operations">
                        Operations
                    </option>

                </select>

            </div>



            <!-- DESIGNATION -->

            <div class="form-group">

                <label for="designation">
                    Designation
                </label>

                <input
                    type="text"
                    id="designation"
                    placeholder="Example: Software Engineer"
                    required
                >

            </div>



            <!-- DATE -->

            <div class="form-group">

                <label for="joining-date">
                    Date of Joining
                </label>

                <input
                    type="date"
                    id="joining-date"
                    required
                >

            </div>



            <!-- BUTTONS -->

            <div class="form-buttons">

                <a
                    href="employees.html"
                    class="cancel-btn"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="save-employee-btn"
                >
                    + Add Employee
                </button>

            </div>


        </form>


    </section>


</main>



<!-- FOOTER -->

<footer class="!bg-primary-dark !text-footer-text text-center py-5 px-4 text-sm mt-auto">
    <p class="m-0">© 2026 TripBoard. All Rights Reserved.</p>
</footer>


</body>

</html>
